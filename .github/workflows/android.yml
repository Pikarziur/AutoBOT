name: Build AutoBOT APK

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]
  workflow_dispatch:

env:
  GRADLE_VERSION: "8.5"
  JAVA_VERSION: "17"

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      # ---- Step 1: 安装 JDK (AGP 8.2 必须 JDK 17+) ----
      - name: Setup JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v5
        with:
          distribution: "temurin"
          java-version: ${{ env.JAVA_VERSION }}

      # ---- Step 2: 通过 gradle/actions/setup-gradle@v5 自动安装 Gradle 8.5 ----
      # 关键：用官方 action 安装 Gradle，比手动 curl 下载 130MB zip 稳定得多
      # 同时启用 Gradle 依赖缓存加速后续编译
      # v5 内部用 Node 24，避免 v4 的 Node 20 弃用警告
      - name: Setup Gradle ${{ env.GRADLE_VERSION }}
        uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: ${{ env.GRADLE_VERSION }}
          cache-read-only: false
          validate-wrappers: false

      # ---- Step 3: 验证 gradle-wrapper.jar 有效性，无效则重新生成 ----
      # 检查：1) 文件是否存在  2) jar 是否包含 GradleWrapperMain 类
      # 若任意条件不满足，用已安装的 gradle 命令重新生成
      - name: Validate & Regenerate Gradle Wrapper
        run: |
          NEED_REGEN=false

          # 检查 1: 文件是否存在
          if [ ! -f "gradle/wrapper/gradle-wrapper.jar" ]; then
            echo "⚠️ gradle-wrapper.jar not found → need regeneration"
            NEED_REGEN=true
          else
            # 检查 2: jar 是否有效（包含 GradleWrapperMain 类）
            if jar tf "gradle/wrapper/gradle-wrapper.jar" 2>/dev/null | grep -q "org/gradle/wrapper/GradleWrapperMain.class"; then
              echo "✅ gradle-wrapper.jar exists and is valid"
              ls -la gradle/wrapper/
            else
              echo "⚠️ gradle-wrapper.jar exists but is CORRUPTED (missing GradleWrapperMain) → need regeneration"
              ls -la gradle/wrapper/
              NEED_REGEN=true
              # 删除损坏的 jar，避免后续判断混乱
              rm -f "gradle/wrapper/gradle-wrapper.jar"
            fi
          fi

          # 需要时重新生成
          if [ "$NEED_REGEN" = true ]; then
            echo "🔧 Generating fresh gradle-wrapper.jar via gradle command..."
            echo "gradle version: $(gradle --version)"
            gradle wrapper --gradle-version "$GRADLE_VERSION" --distribution-type bin --no-daemon

            if [ -f "gradle/wrapper/gradle-wrapper.jar" ]; then
              echo "✅ Generated gradle-wrapper.jar successfully:"
              ls -la gradle/wrapper/
              # 再次验证新生成的 jar
              if jar tf "gradle/wrapper/gradle-wrapper.jar" 2>/dev/null | grep -q "org/gradle/wrapper/GradleWrapperMain.class"; then
                echo "✅ New jar validated successfully"
              else
                echo "❌ New jar still invalid, aborting"
                exit 1
              fi
            else
              echo "❌ Failed to generate gradle-wrapper.jar"
              ls -la gradle/ || true
              exit 1
            fi
          fi
        shell: bash

      # ---- Step 4: 给 gradlew 执行权限（Git 有时丢失） ----
      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      # ---- Step 5: 安装 Android SDK 所需组件（含 NDK + CMake 用于 Native 编译）----
      # v4 支持 Node 24；只用它安装 cmdline-tools 并把 sdkmanager 加入 PATH
      - name: Setup Android SDK (cmdline-tools + PATH)
        uses: android-actions/setup-android@v4
        with:
          accept-android-sdk-licenses: true
          log-accepted-android-sdk-licenses: false
          # 不在 packages 中列组件，避免多行 packages 被合并成单字符串的 bug
          packages: ''

      # 用 sdkmanager 命令逐个安装组件（每个包名独立参数，避免解析问题）
      - name: Install Android SDK Components
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "sdkmanager path: $(which sdkmanager)"
          sdkmanager --install \
            "platforms;android-34" \
            "build-tools;34.0.0" \
            "platform-tools" \
            "ndk;25.2.9519653" \
            "cmake;3.22.1"
          echo "✅ SDK components installed"
          sdkmanager --list_installed || sdkmanager --list | head -50
        shell: bash

      # ---- Step 6: 从 GitHub Secrets 解码固定签名 keystore ----
      # 保证每次 CI 构建的 APK 签名一致，Shizuku 授权不会因签名变化而失效
      # secrets 上下文不能直接用在 if 条件里，改用 env + 脚本内部判断
      - name: Decode signing keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "⚠️ No keystore secret configured, skipping (will use default debug signing)"
            exit 0
          fi
          echo "🔑 Decoding keystore from GitHub Secrets..."
          echo "$KEYSTORE_BASE64" | base64 -d > $HOME/autobot-release.jks
          # 创建 keystore.properties 供 build.gradle.kts 读取
          cat > keystore.properties <<EOF
          storeFile=$HOME/autobot-release.jks
          storePassword=$KEYSTORE_PASSWORD
          keyAlias=$KEY_ALIAS
          keyPassword=$KEY_PASSWORD
          EOF
          echo "✅ keystore.properties created"
        shell: bash

      # ---- Step 7: 编译 Debug APK ----
      # 优先用 ./gradlew；若 wrapper 失败或 jar 无效，直接 fallback 到 gradle 命令
      - name: Build Debug APK
        run: |
          USE_WRAPPER=false
          if [ -f "gradle/wrapper/gradle-wrapper.jar" ] && jar tf "gradle/wrapper/gradle-wrapper.jar" 2>/dev/null | grep -q "org/gradle/wrapper/GradleWrapperMain.class"; then
            USE_WRAPPER=true
          fi

          if [ "$USE_WRAPPER" = true ]; then
            echo "🔨 Building with ./gradlew..."
            if ./gradlew assembleDebug --stacktrace --no-daemon; then
              echo "✅ Build via gradlew succeeded"
              exit 0
            fi
            echo "⚠️ gradlew build failed, falling back to direct gradle command"
          fi

          echo "🔨 Building with gradle directly..."
          gradle assembleDebug --stacktrace --no-daemon
        shell: bash

      # ---- Step 8: 编译 Release APK（使用固定签名 keystore） ----
      - name: Build Release APK
        run: |
          USE_WRAPPER=false
          if [ -f "gradle/wrapper/gradle-wrapper.jar" ] && jar tf "gradle/wrapper/gradle-wrapper.jar" 2>/dev/null | grep -q "org/gradle/wrapper/GradleWrapperMain.class"; then
            USE_WRAPPER=true
          fi

          BUILD_OK=false
          if [ "$USE_WRAPPER" = true ]; then
            echo "🔨 Building Release APK with ./gradlew..."
            if ./gradlew assembleRelease --stacktrace --no-daemon; then
              BUILD_OK=true
              echo "✅ Release build via gradlew succeeded"
            else
              echo "⚠️ gradlew release build failed, trying direct gradle..."
            fi
          fi

          if [ "$BUILD_OK" = false ]; then
            echo "🔨 Building Release APK with gradle directly..."
            gradle assembleRelease --stacktrace --no-daemon || true
          fi
        shell: bash

      # ---- Step 9: 上传 Debug APK Artifact ----
      - name: Upload Debug APK
        uses: actions/upload-artifact@v5
        with:
          name: AutoBOT-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 30

      # ---- Step 10: 上传 Release APK Artifact ----
      - name: Upload Release APK (if built)
        uses: actions/upload-artifact@v5
        with:
          name: AutoBOT-release-apk
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: ignore
          retention-days: 30

      # ---- Step 11: 上传 mapping & logs（排查用） ----
      - name: Upload Build Outputs (on failure)
        if: failure()
        uses: actions/upload-artifact@v5
        with:
          name: build-logs
          path: |
            app/build/reports/**
            app/build/outputs/logs/**
            **/*.log
          if-no-files-found: ignore
          retention-days: 7
