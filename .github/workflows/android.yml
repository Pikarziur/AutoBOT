name: Build AutoBOT APK

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]
  workflow_dispatch:

env:
  GRADLE_VERSION: "8.5"
  JAVA_VERSION: "17"

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # ---- Step 1: 安装 JDK (AGP 8.2 必须 JDK 17+) ----
      - name: Setup JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: ${{ env.JAVA_VERSION }}

      # ---- Step 2: 通过 gradle/actions/setup-gradle@v4 自动安装 Gradle 8.5 ----
      # 关键：用官方 action 安装 Gradle，比手动 curl 下载 130MB zip 稳定得多
      # 同时启用 Gradle 依赖缓存加速后续编译
      - name: Setup Gradle ${{ env.GRADLE_VERSION }}
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: ${{ env.GRADLE_VERSION }}
          cache-read-only: false
          validate-wrappers: false

      # ---- Step 3: 若仓库缺少 gradle-wrapper.jar，用已安装的 gradle 命令生成 ----
      # 此时 gradle 8.5 已在 PATH 中，直接调用即可
      - name: Generate Gradle Wrapper (if jar missing)
        run: |
          if [ -f "gradle/wrapper/gradle-wrapper.jar" ]; then
            echo "✅ gradle-wrapper.jar already exists, skip generation"
            ls -la gradle/wrapper/
            exit 0
          fi

          echo "⚠️ gradle-wrapper.jar not found. Generating via gradle command..."
          echo "gradle version: $(gradle --version)"
          gradle wrapper --gradle-version "$GRADLE_VERSION" --distribution-type bin --no-daemon

          if [ -f "gradle/wrapper/gradle-wrapper.jar" ]; then
            echo "✅ Generated gradle-wrapper.jar successfully:"
            ls -la gradle/wrapper/
          else
            echo "❌ Failed to generate gradle-wrapper.jar"
            ls -la gradle/ || true
            exit 1
          fi
        shell: bash

      # ---- Step 4: 给 gradlew 执行权限（Git 有时丢失） ----
      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      # ---- Step 5: 安装 Android SDK 所需组件（含 NDK + CMake 用于 Native 编译）----
      # v4 支持 Node 24；只用它安装 cmdline-tools 并把 sdkmanager 加入 PATH
      - name: Setup Android SDK (cmdline-tools + PATH)
        uses: android-actions/setup-android@v4
        with:
          accept-android-sdk-licenses: true
          log-accepted-android-sdk-licenses: false
          # 不在 packages 中列组件，避免多行 packages 被合并成单字符串的 bug
          packages: ''

      # 用 sdkmanager 命令逐个安装组件（每个包名独立参数，避免解析问题）
      - name: Install Android SDK Components
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "sdkmanager path: $(which sdkmanager)"
          sdkmanager --install \
            "platforms;android-34" \
            "build-tools;34.0.0" \
            "platform-tools" \
            "ndk;25.2.9519653" \
            "cmake;3.22.1"
          echo "✅ SDK components installed"
          sdkmanager --list_installed || sdkmanager --list | head -50
        shell: bash

      # ---- Step 6: 编译 Debug APK（无需签名密钥） ----
      # 优先用 ./gradlew，若 wrapper 仍有问题则 fallback 到 gradle 命令
      - name: Build Debug APK
        run: |
          if [ -f "gradle/wrapper/gradle-wrapper.jar" ]; then
            ./gradlew assembleDebug --stacktrace --no-daemon
          else
            echo "⚠️ wrapper jar missing, using gradle directly"
            gradle assembleDebug --stacktrace --no-daemon
          fi
        shell: bash

      # ---- Step 7: 可选：编译 Release APK（无密钥时使用 debug 签名，方便测试） ----
      - name: Build Release APK (signed with debug keystore)
        run: |
          # 创建一个临时 debug keystore 用于 release
          keytool -genkeypair -v \
            -keystore $HOME/debug.keystore \
            -alias androiddebugkey \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass android -keypass android \
            -dname "CN=AutoBOT Debug, OU=AutoBOT, O=AutoBOT, L=CN, ST=CN, C=CN" \
            || true
          if [ -f "gradle/wrapper/gradle-wrapper.jar" ]; then
            ./gradlew assembleRelease \
              -Pandroid.injected.signing.store.file=$HOME/debug.keystore \
              -Pandroid.injected.signing.store.password=android \
              -Pandroid.injected.signing.key.alias=androiddebugkey \
              -Pandroid.injected.signing.key.password=android \
              --stacktrace --no-daemon || true
          else
            gradle assembleRelease \
              -Pandroid.injected.signing.store.file=$HOME/debug.keystore \
              -Pandroid.injected.signing.store.password=android \
              -Pandroid.injected.signing.key.alias=androiddebugkey \
              -Pandroid.injected.signing.key.password=android \
              --stacktrace --no-daemon || true
          fi
        shell: bash

      # ---- Step 8: 上传 Debug APK Artifact ----
      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: AutoBOT-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 30

      # ---- Step 9: 上传 Release APK Artifact ----
      - name: Upload Release APK (if built)
        uses: actions/upload-artifact@v4
        with:
          name: AutoBOT-release-apk
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: ignore
          retention-days: 30

      # ---- Step 10: 上传 mapping & logs（排查用） ----
      - name: Upload Build Outputs (on failure)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs
          path: |
            app/build/reports/**
            app/build/outputs/logs/**
            **/*.log
          if-no-files-found: ignore
          retention-days: 7
